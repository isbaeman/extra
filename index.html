
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten Letter</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #e8e2d8;
    font-family: 'Kalam', cursive;
    font-style: italic;
    display: flex;
    justify-content: center;
    padding: 35px 16px;
}

.letter {
    width: 100%;
    max-width: 700px;
    font-size: 19px;
    line-height: 1.9;
}

#content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 19px;
    background: #e8e2d8;
    animation: blink 0.8s infinite;
    vertical-align: middle;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

@media (max-width: 500px) {
    .letter {
        font-size: 17px;
        line-height: 1.8;
    }
}
</style>
</head>

<body>

<div class="letter">
    <div id="content"></div><span class="cursor" id="cursor"></span>
</div>

<script>
const letter = `Dear Friend,

I hope you are doing well. I wanted to write this letter because sometimes it is easier to express our feelings through words.

Life keeps us busy with so many things, and we often forget to tell the people around us how much they mean to us. Even a small message or a few kind words can make someone's day better.

I want you to remember that every day is a new opportunity to learn, grow, and become a better person. Never lose hope when things become difficult. Be patient with yourself and keep moving forward.

Thank you for being a part of my life. I hope happiness, peace, and success always find their way to you.

Take care of yourself.

With best wishes,
Your Friend`;

const output = document.getElementById("content");
const cursor = document.getElementById("cursor");

let index = 0;

function writeLetter() {
    if (index < letter.length) {
        output.textContent += letter[index];
        index++;

        let delay = 42;

        if (".!?".includes(letter[index - 1])) {
            delay = 300;
        } else if (letter[index - 1] === "\n") {
            delay = 180;
        } else if (letter[index - 1] === ",") {
            delay = 150;
        }

        setTimeout(writeLetter, delay);
    } else {
        cursor.style.display = "none";
    }
}

writeLetter();
</script>

</body>
</html>
