
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Letter</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #e8e2d8;
    font-family: 'Kalam', cursive;
    font-style: italic;
}

#lockScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

#lockScreen h2 {
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

#password {
    width: 240px;
    padding: 13px;
    background: #080808;
    border: 1px solid #555;
    border-radius: 4px;
    outline: none;
    color: #e8e2d8;
    font: 16px Arial, sans-serif;
    text-align: center;
    letter-spacing: 5px;
}

#password:focus {
    border-color: #c9b58b;
}

#unlock {
    margin-top: 18px;
    padding: 10px 32px;
    background: transparent;
    color: #e8e2d8;
    border: 1px solid #777;
    cursor: pointer;
    font: 14px Arial, sans-serif;
    letter-spacing: 2px;
}

#unlock:hover {
    border-color: #e8e2d8;
}

#error {
    color: #c98b8b;
    font: 13px Arial, sans-serif;
    margin-top: 15px;
}

#letterScreen {
    display: none;
    justify-content: center;
    padding: 35px 16px;
    min-height: 100vh;
}

.letter {
    width: 100%;
    max-width: 700px;
    font-size: 19px;
    line-height: 1.9;
}

#content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 19px;
    background: #e8e2d8;
    animation: blink 0.8s infinite;
    vertical-align: middle;
}

@keyframes blink {
    50% { opacity: 0; }
}

@media (max-width: 500px) {
    .letter {
        font-size: 17px;
        line-height: 1.8;
    }
}
</style>
</head>

<body>

<!-- Password Screen -->
<div id="lockScreen">
    <h2>A Private Letter</h2>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
    >

    <button id="unlock">UNLOCK</button>
    <p id="error"></p>
</div>

<!-- Letter Screen -->
<div id="letterScreen">
    <div class="letter">
        <div id="content"></div><span class="cursor" id="cursor"></span>
    </div>
</div>

<script>
const correctPassword = "2322007";

const letter = `Assalam o Alikum jani kiway hal hay😁😁
sb say phelyy soooooooooooooooooooooooooorrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrryyyyyyyyyyyyyyyyyyyyyyyyy😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭
Qky may ayesha ky ghr ki rat ko or subha mujhy PAC jana tha usky sath to rat wahin stay kia or ab aye hun like 2:10 may orr ab likh rahii i knoww ap wait krahy hogy or may usky clg gye sahi tha sb.
jo phely miss thi na vo na kheti kyy CA ky bachy ziyada hardworking hoty as compared to other students or vo nahhhhhhh kaha ky pta nhi koi cheez apka main target hona chehayay.
orrrrrrrrrrrr usky ilawa mayny kl saree pheni areej ki but ahammm may thori si moti hun nahh to agy ap smjh jao 😗😗😗😗😗😗.
or yay kyyyyyyyyyyyyyyyyyyyyyy may abhi mall jarahii 3 bjy or subha subha mujhy migraine hogya qky nahhhhhhhh subha subha mujh say nahh esy nhi jaya jata or abhii ky liayyyyy bsssss.
or may pics bhi send krdun gi.
okk phir monday ko bat hotii love you byeeee orr check krlia krnaa okkkkk 
okkkkk phirrrrr love you 300000000000000000000000 byeeeeeeeeeeeeeee chumiiiiiii .
`;

const lockScreen = document.getElementById("lockScreen");
const letterScreen = document.getElementById("letterScreen");
const passwordInput = document.getElementById("password");
const error = document.getElementById("error");
const output = document.getElementById("content");
const cursor = document.getElementById("cursor");

let index = 0;

function unlockLetter() {
    if (passwordInput.value === correctPassword) {
        lockScreen.style.display = "none";
        letterScreen.style.display = "flex";
        error.textContent = "";
        writeLetter();
    } else {
        error.textContent = "Incorrect password. Try again.";
        passwordInput.value = "";
        passwordInput.focus();
    }
}

function writeLetter() {
    if (index < letter.length) {
        output.textContent += letter[index];
        index++;

        let delay = 42;
        const char = letter[index - 1];

        if (".!?".includes(char)) {
            delay = 300;
        } else if (char === "\n") {
            delay = 180;
        } else if (char === ",") {
            delay = 150;
        }

        setTimeout(writeLetter, delay);
    } else {
        cursor.style.display = "none";
    }
}

document.getElementById("unlock")
    .addEventListener("click", unlockLetter);

passwordInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        unlockLetter();
    }
});
</script>

</body>
</html>
